<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Elite Eleven</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <div class="logo">E11</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="roster.html">Roster</a>
        <a href="matches.html">Matches</a>
        <a href="shop.html">Shop</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <section class="page-title">
        <p class="subtitle">GET IN TOUCH</p>
        <h1>CONTACT US</h1>
        <p>Hai una domanda? Scrivici.</p>
    </section>


    <section class="contact-form">

        <form>

            <label for="name">Nome</label>
            <input type="text" id="name" placeholder="Inserisci il tuo nome">


            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Inserisci la tua email">


            <label for="reason">Motivo del contatto</label>

            <select id="reason">

                <option>Informazioni</option>
                <option>Collaborazione</option>
                <option>Merchandise</option>
                <option>Team</option>

            </select>


            <label for="message">Messaggio</label>

            <textarea id="message" rows="6"
                placeholder="Scrivi il tuo messaggio"></textarea>


            <div class="checkbox">

                <input type="checkbox" id="privacy">

                <label for="privacy">
                    Accetto il trattamento dei dati.
                </label>

            </div>


            <button type="submit">INVIA MESSAGGIO</button>

        </form>

    </section>

</main>

<footer>
    <p>©2026 Elite Eleven Esports</p>
</footer>

</body>
</html>
